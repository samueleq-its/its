    <!--Open Graph for Social Card-->
	<meta property="og:title" content="insert title">

	<meta property="og:url" content="http://127.0.0.1:5500/Web%20Dev/HTML-CSS/02-html-elements/04-lists-and-tables/index.html">

<body>
    <head>
        <h1>4. Lists and tables</h1>
    </head>
    <main>
        <table>
        <thead>
            <th>Unordered list of links</th>
            <th>Ordered list of Images</th>
        </thead>
        <tr>
            <td>
                <ul>
                    <li><a href="https://en.wikipedia.org/wiki/Flower">Flowers</a></li>
                    <li><a href="https://en.wikipedia.org/wiki/Flowering_plant">Flowering plant</a></li>
                    <li><a href="https://en.wikipedia.org/wiki/Floral_morphology">Floral morphology</a></li>
                </ul>
            </td>
            <td>
                <ol>
                    <li><img src="./assets/img/1280px-Sunflower_from_Silesia.jpg" alt="Girasole" height="64px"></li>
                    <li><img src="./assets/img/Passiflora_caerulea_(makro_close-up).jpg" alt="Passiflora" height="64px"></li>
                    <li><img src="./assets/img/Rafflesia_arnoldii_Bunga_Nasional_Indonesia_01_(cropped).jpg" alt="Rafflesia" height="64px"></li>
                </ol>
            </td>
        </tr>
    </table>
    </main>
    
</body>
