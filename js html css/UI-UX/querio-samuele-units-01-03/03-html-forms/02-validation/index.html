<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>2. Validation</title>
    <meta name="author" content="Samuele">
    <meta name="description" content="form exercise">

    <!--css and scripts-->
    <link rel="stylesheet" href="./styles/style.css?v=1.0">
    <script defer src="./scripts/main.js?v=1.0"></script>
</head>

<body>
    <header>
        <h1>2. Validation</h1>
    </header>
    <main>
        <h2>Form</h2>
        <form action="https://webhook.site/da454dd8-0aa1-4079-a12a-fee306c8d3d8" method="post">
            <ul>
                <li> <!--mission-->
                    <label for="mission">Desired mission</label><br>
                    <select name="mission" id="mission" required>
                        <option hidden disabled selected value> -- select an option -- </option>
                        <option value="farside_seismic_suite">Farside Seismic Suite</option>
                        <option value="cadre">CADRE</option>
                        <option value="sunrise">SunRISE</option>
                        <option value="veritas">VERITAS</option>
                        <option value="near_earth_object_surveyor">Near Earth Object Surveyor</option>
                        <option value="asthor">ASTHROS</option>
                        <option value="maia">MAIA</option>
                    </select>
                </li>

                <li> <!--contacts-->
                    <fieldset>
                        <legend>Contats</legend>
                        <label for="first_name">First name:</label>
                        <input type="text" id="first_name" name="first_name" required> <br>
                        <label for="middle_name">Middle name:</label>
                        <input type="text" id="middle_name" name="middle_name"> <br>
                        <label for="last_name">Last name:</label>
                        <input type="text" id="last_name" name="last_name" required> <br>
                        <br>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" required> <br>
                        <label for="phone">Phone number:</label>
                        <input type="tel" name="phone" id="phone" pattern="[0-9]*"> <br>
                        <label for="address">Address:</label>
                        <input type="text" name="address" id="address" required> <br>
                    </fieldset>
                </li>

                <li> <!--physical characteristics-->
                    <fieldset>
                        <legend>Physical characteristics</legend>
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" min="18" max="100" required>
                        <p>Gender</p>
                        <input type="radio" name="gender" id="male" value="male" required>
                        <label for="male">Male</label>
                        <input type="radio" name="gender" id="female" value="female" required>
                        <label for="female">Female</label>
                        <input type="radio" name="gender" id="other" value="other" required>
                        <label for="other">Other</label>
                        <br>
                        <label for="eye_color">Eye color:</label>
                        <select name="eye_color" id="eye_color" required>
                            <option hidden disabled selected value> -- select an option -- </option>
                            <option value="brown">Brown</option>
                            <option value="amber">Amber</option>
                            <option value="hazel">Hazel</option>
                            <option value="green">Green</option>
                            <option value="blue">Blue</option>
                            <option value="other">Other</option>
                        </select> <br>
                        <label for="hair_color">Hair color:</label>
                        <select name="hair_color" id="hair_color" required>
                            <option hidden disabled selected value> -- select an option -- </option>
                            <option value="black">Black</option>
                            <option value="brown">Brown</option>
                            <option value="auburn">Auburn</option>
                            <option value="red">Red</option>
                            <option value="blond">Blond</option>
                            <option value="other">Other</option>
                        </select>
                        <br>
                        <label for="weight">Weight:</label>
                        <input type="number" id="weight" name="weight" min="0" max="100" required>
                        <label for="weight">Kg</label>
                    </fieldset>
                </li>

                <li> <!--biography-->
                    <label for="biography">Biography:</label> <br>
                    <textarea rows="4" cols="40" name="biography" id="biography" maxlength="1000"></textarea>
                </li>
                <li>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </li>
            </ul>
        </form>
    </main>
</body>

</html>
