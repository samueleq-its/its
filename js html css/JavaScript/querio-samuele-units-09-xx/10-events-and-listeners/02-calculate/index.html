<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Calculator</title>
  <link rel="stylesheet" href="./styles/style.css">
  <script defer src="./scripts/main.js"></script>
</head>

<body>
  <!--square-->
  <div>
    <label>Square this number:
      <input type="number" id="square-input" size="2">
    </label>
    <button id="square-button">Calculate</button>
  </div>

  <!--half-->
  <div>
    <label>Half this number:
      <input type="number" id="half-input" size="2">
    </label>
    <button id="half-button">Calculate</button>
  </div>

  <!--percentage-->
  <div>
    <label>Percentage:
      <input type="number" id="percentage-input" size="2">
    </label>
    <button id="percentage-button">Calculate</button>
  </div>

  <!--circle area-->
  <div>
    <label>Circle area (radius):
      <input type="number" id="circle-input" size="2">
    </label>
    <button id="circle-button">Calculate</button>
  </div>

  <div id="solution"></div>
</body>

</html>
