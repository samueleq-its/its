<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}"></head>

<body>
	<div class="container">

		<div th:replace="~{fragments :: navbar}"></div>

		<h1 th:text="${title}"></h1>


		<form action="" method="post" enctype="multipart/form-data">
			<label for="date">Data:</label>
			<input type="date" name="date" id="date" th:value="${transaction.date}">
			<label for="description">Descrizione:</label>
			<input type="text" name="description" th:value="${transaction.description}">
			<label for="category">Categoria:</label>
			<input type="text" name="category" th:value="${transaction.category}">
			<label for="type">Tipo:</label>
			<select name="type">
				<option value="">Seleziona una categoria</option>
				<option th:each="transactionType : ${transactionTypes}" th:value="${transactionType}"
					th:text="${transactionType}">
				</option>
			</select>
			<label for="amount">Importo:</label>
			<input type="number" name="amount" th:value="${transaction.amount}">
			<label for="receipt">Scontrini:</label>
			<input type="file" name="receiptFile" id="receipt">
			<a th:if="${transaction.receipt != null and !#strings.isEmpty(transaction.receipt)}"
				th:href="@{/transactions/{id}/receipt(id=${transaction.id})}" role="button">Scarica scontrino attuale</a>
			<input type="submit" value="modifica">
		</form>

	</div>
</body>

</html>
