services:
  mysql:
    image: mysql:8.4
    container_name: contactmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: contactmanager
    ports:
      - "3307:3306"
    volumes:
      - contactmanager_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  quarkus:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: contactmanager-quarkus
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: jdbc:mysql://mysql:3306/contactmanager
      BACKEND_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  contactmanager_mysql_data:
