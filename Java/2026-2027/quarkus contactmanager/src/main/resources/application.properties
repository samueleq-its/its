# Applicazione
quarkus.application.name=contactmanager

# Database MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:root}

quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/contactmanager}

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update

# Porta HTTP
quarkus.http.port=${BACKEND_PORT:8080}