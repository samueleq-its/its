<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuovo Evento')}"></head>
<body>

    <!-- Header / Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h1>Crea Nuovo Evento</h1>
            <a href="/" class="outline" role="button">← Torna alla lista</a>
        </div>

        <!-- Form -->
        <form id="create-evento-form">
            <div class="grid">
                <div>
                    <label for="titolo">Titolo</label>
                    <input type="text" id="titolo" placeholder="Es. Nascita della scrittura" required>
                </div>
                <div>
                    <label for="anno">Anno</label>
                    <input type="number" id="anno" placeholder="Es. -3500" required>
                </div>
            </div>

            <div class="grid">
                <div>
                    <label for="luogo">Luogo</label>
                    <input type="text" id="luogo" placeholder="Es. Mesopotamia">
                </div>
                <div>
                    <label for="civilta">Civiltà</label>
                    <input type="text" id="civilta" placeholder="Es. Sumeri">
                </div>
                <div>
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" placeholder="Es. cultura">
                </div>
            </div>

            <div>
                <label for="descrizione">Descrizione</label>
                <textarea id="descrizione" rows="4" placeholder="Breve descrizione dell'evento..."></textarea>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit">Crea Evento</button>
            </div>
        </form>
    </main>

    <!-- API Submission Script -->
    <script>
        document.getElementById('create-evento-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newEvento = {
                titolo: document.getElementById('titolo').value,
                anno: parseInt(document.getElementById('anno').value),
                luogo: document.getElementById('luogo').value,
                civilta: document.getElementById('civilta').value,
                categoria: document.getElementById('categoria').value,
                descrizione: document.getElementById('descrizione').value
            };

            try {
                const response = await fetch('/api/eventi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEvento)
                });

                if (!response.ok) {
                    throw new Error('Errore durante la creazione dell\'evento');
                }

                alert('Evento creato con successo!');
                window.location.href = '/';
            } catch (error) {
                console.error('Errore:', error);
                alert('Si è verificato un errore durante il salvataggio.');
            }
        });
    </script>
</body>
</html>
