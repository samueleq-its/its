<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head}"></head>

<body>
	<div class="container">

		<div th:replace="~{fragments :: navbar}"></div>

		<h1 th:text="${title}"></h1>

		<p th:text="|Saldo: ${data.total}|"></p>
		<p th:text="|Entrate: ${data.inflows}|"></p>
		<p th:text="|Uscite: ${data.outflows}|"></p>
		<p th:text="|Bilancio mensile: ${data.monthlyBalance}|"></p>
		<article>
			<h2>Bilancio per categoria</h2>
			<ul>
				<li th:each="entry : ${data.perCategory}">
					<span th:text="${entry.key}"></span>: <span th:text="${entry.value}"></span>
				</li>
			</ul>
		</article>



	</div>
</body>

</html>
