<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${title}">Prodotti</title>
	<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>
</head>
<body>
	<div class="container">
		<h1 th:text="${title}">Prodotti</h1>

		<form action="/prodotti" method="post">
			<label for="prodotto">prodotto</label>
			<input type="text" id="prodotto" name="prodotto">
			
			<label for="sezione">sezione</label>
			<select id="sezione" name="sezione">
				<option th:each="s : ${sezioni}" th:value="${s}" th:text="${s}"></option>
			</select>

			<label for="prezzo">prezzo</label>
			<input type="number" id="prezzo" name="prezzo" step="0.01">

			<button type="submit">Aggiungi Prodotto</button>


		</form>


		<table>
			<thead>
				<tr>
					<th>Prodotto</th>
					<th>Prezzo</th>
					<th>Sezione</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="prodotto : ${prodotti}">
					<td th:text="${prodotto.prodotto}">Prodotto</td>
					<td th:text="${prodotto.prezzo}">Prezzo</td>
					<td th:text="${prodotto.sezione}">Sezione</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
